<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APROGOS VOICE - Exercices</title>
  <meta name="description" content="Fiches pratiques de solfège, voix, écoute, technique et harmonie pour les répétitions d'APROGOS VOICE.">
  <meta name="theme-color" content="#071a3a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../css/main.css">

          <h1 id="exercises-title" class="mt-3 text-4xl font-black tracking-[-0.05em] text-slate-950 sm:text-6xl">Fiches pratiques</h1>

        <div class="mt-8 overflow-x-auto pb-2" aria-label="Catégories d'exercices">
          <div id="exerciseTabs" class="flex min-w-max gap-2"></div>

        <div id="exerciseGrid" class="mt-8 grid gap-4 md:grid-cols-2 xl:grid-cols-3" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="../data/exercices.js"></script>
  <script src="../js/utils/helpers.js"></script>
